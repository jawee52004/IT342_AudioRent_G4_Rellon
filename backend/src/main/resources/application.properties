# --- Server Configuration ---
# Railway injects PORT automatically; fallback to 8080 for local dev
server.port=${PORT:8080}

# --- JWT Configuration ---
app.jwt.secret=${JWT_SECRET:local-dev-secret-change-in-production}
app.jwt.expiration=86400000

# --- Firebase Configuration ---
# Credentials are loaded in FirebaseConfig.java
# Locally: reads firebase-service-account.json from resources/
# On Railway: reads FIREBASE_SERVICE_ACCOUNT_JSON env var (base64 encoded)

# --- PayMongo Configuration ---
paymongo.secret.key=${PAYMONGO_SECRET_KEY:sk_test_PLACEHOLDER}
paymongo.public.key=${PAYMONGO_PUBLIC_KEY:pk_test_PLACEHOLDER}
paymongo.base.url=https://api.paymongo.com/v1